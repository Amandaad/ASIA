services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio_as}
      POSTGRES_USER: ${POSTGRES_USER:-asia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asia} -d ${POSTGRES_DB:-studio_as}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [asia_net]

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [asia_net]

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${PUBLIC_BASE_URL}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-troque-esta-chave-de-criptografia}
      GENERIC_TIMEZONE: ${TIMEZONE:-America/Fortaleza}
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [asia_net]

volumes:
  postgres_data:
  n8n_data:

networks:
  asia_net:
    driver: bridge
